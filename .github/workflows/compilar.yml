# Compila automáticamente:
#   - ManoBionica.exe para Windows (se descarga desde la pestaña Actions o Releases)
#   - el firmware de la ESP32-S3 (para comprobar que compila y dejar el .bin)
#
# Para publicar una versión con descarga directa en "Releases", crea una etiqueta:
#   git tag v1.0.0 && git push origin v1.0.0
name: Compilar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # necesario para publicar la Release al crear una etiqueta v*

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: ManoBionica.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Descargar el modelo de MediaPipe
        run: python -c "from mano.vision import asegurar_modelo; asegurar_modelo()"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Crear el ejecutable
        run: pyinstaller --noconfirm mano_app.spec

      - name: Comprobar que el .exe arranca (autoprueba)
        shell: pwsh
        run: |
          $exe = "dist\ManoBionica\ManoBionica.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--autoprueba" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "La autoprueba no terminó en 3 minutos" }
          Get-Content "dist\ManoBionica\autoprueba.log"
          if ($p.ExitCode -ne 0) { throw "La autoprueba del .exe ha fallado (código $($p.ExitCode))" }
          Remove-Item "dist\ManoBionica\autoprueba.log"

      - name: Empaquetar en .zip
        shell: pwsh
        run: |
          Copy-Item LEEME_WINDOWS.txt dist\ManoBionica\LEEME.txt
          Compress-Archive -Path dist\ManoBionica -DestinationPath ManoBionica-Windows.zip
          "{0:N0} MB" -f ((Get-Item ManoBionica-Windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ManoBionica-Windows
          path: ManoBionica-Windows.zip
          retention-days: 30

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ManoBionica-Windows.zip
          generate_release_notes: true

  firmware:
    name: Firmware ESP32-S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar placa ESP32 y librería PCA9685
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit PWM Servo Driver Library"

      - name: Compilar
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --warnings all \
            --output-dir build firmware/ManoBionicaESP32S3

      - uses: actions/upload-artifact@v4
        with:
          name: Firmware-ESP32S3
          path: build/*.bin
          retention-days: 30
